[package]
name = "kamen"
version = "0.1.0"
edition = "2024"
description = "Free VTuber app for macOS: drive a VRM avatar with your face and send it to OBS."
authors = ["Doruk Özer"]
license = "WTFPL"

[dependencies]
cameras = "0.3.2"
eframe = { version = "0.34", features = ["glow"] }
egui = "0.34.3"
egui-cameras = "0.3.2"
glam = "0.29"
glow = "0.17"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
image = "0.25.10"
ndarray = "0.17.2"
ort = "2.0.0-rc.14"
rfd = "0.17.2"
serde_json = "1.0.154"

[profile.dev.package."*"]
opt-level = 3
